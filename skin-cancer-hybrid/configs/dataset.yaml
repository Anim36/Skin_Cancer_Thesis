# =============================================================================
# Dataset configuration - loaders, label spaces, splits, preprocessing
# =============================================================================
# IMPORTANT SCIENTIFIC NOTE
# -------------------------
# The four datasets do NOT share an identical label space:
#   HAM10000    : 7 classes  (MEL, NV, BCC, AKIEC, BKL, DF, VASC)
#   ISIC 2018   : 7 classes  (MEL, NV, BCC, AKIEC, BKL, DF, VASC)
#   ISIC 2019   : 8 classes  (MEL, NV, BCC, AKIEC, BKL, DF, VASC, SCC)
#   PAD-UFES-20 : 6 classes  (MEL, NV, BCC, AKIEC, BKL, SCC)
#
# A shared 7-class head is used for the "compatible class" experiments where
# SCC is EXCLUDED (not remapped to any other class). Every excluded sample is
# retained in the harmonised manifest with `unified_label = -1` and
# `unified_label_valid = False`, so that no data is silently discarded and the
# native 8-class / 6-class heads remain fully trainable.
#
# The actual mapping is NOT guessed here. It is derived from the real dataset
# metadata at runtime by data/label_mapping.py, and the compatibility report is
# regenerated by scripts/inspect_datasets.py.
# =============================================================================

preprocessing:
  image_size: 224
  color_mode: "RGB"
  interpolation: "bilinear"
  hair_removal: true
  hair_removal_method: "dullrazor"    # dullrazor | morphological | none
  clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  denoise: false
  denoise_strength: 5                # fastNlMeansDenoising h parameter
  normalize: "imagenet"              # imagenet | unit | none
  preserve_originals: true

augmentation:
  # Train-only. Deliberately conservative: dermoscopic colour and asymmetry are
  # diagnostic, so hue/saturation shifts are kept mild and elastic distortion is
  # disabled by default.
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.0
  rotation_limit: 30
  scale_limit: 0.15
  translate_limit: 0.05
  brightness_limit: 0.2
  contrast_limit: 0.2
  hue_shift: 0.02
  saturation_shift: 0.15
  random_crop: true
  crop_scale_limit: 0.9
  elastic_transform: false
  gaussian_blur_prob: 0.0
  gaussian_noise_prob: 0.0
  coarse_dropout_prob: 0.0

segmentation_preprocessing:
  mask_interpolation: "nearest"      # NEVER bilinear on masks
  mask_threshold: 0.5
  min_positive_ratio: 0.005          # masks below this are flagged invalid
  max_positive_ratio: 0.95

splitting:
  ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  seed: 42
  stratify: true
  group_by: "auto"                   # auto | patient | lesion | none
  # Cross-dataset duplicate images are forced into the SAME split so that an
  # image present in both HAM10000 and ISIC 2019 cannot leak across splits.
  unify_duplicates_across_datasets: true

deduplication:
  enabled: true
  exact_hash: true                   # SHA-1 of raw file bytes
  perceptual: true
  phash_size: 16                     # 16 -> 256-bit dHash
  phash_max_distance: 4              # Hamming distance for near-duplicate
  # Near-duplicate clusters are merged by keeping the first member and dropping
  # the rest, so the same lesion cannot appear twice in one split.
  drop_near_duplicates: true

metadata:
  # PAD-UFES-20 clinical fields. Fitted encoders are saved with the model so
  # inference uses exactly the training-time transformation.
  numerical: ["age"]
  categorical: ["sex", "localization", "skin_cancer_history"]
  # Which datasets may contribute clinical metadata.
  #
  # ONLY PAD-UFES-20 ships validated clinical annotations that were recorded
  # for the study.  HAM10000, ISIC 2018 and ISIC 2019 redistribute partial
  # clinical fields in some mirrors, but they are not comparable to
  # PAD-UFES-20 and their provenance is uncertain.  They are therefore
  # excluded by default so that the multimodal comparison measures the effect
  # of *real, study-grade* clinical metadata rather than a mix of sources.
  #
  # Set to true only if you have verified the provenance of the clinical
  # fields in your copy of the dataset.
  source_datasets: ["pad_ufes20"]
  missing_strategy:
    numerical: "median_then_indicator"
    categorical: "special_token"
  normalize_numerical: true
  max_categories: 64

label_mapping:
  # Canonical short codes used across the project.
  canonical_classes:
    - MEL
    - NV
    - BCC
    - AKIEC
    - BKL
    - DF
    - VASC
    - SCC
  # Which native classes may enter the unified 7-class head.
  unified_head_excludes: ["SCC"]
  # Native label aliases are resolved at runtime from the real metadata files.
  # These are only fallbacks for the classic ISIC/HAM codebooks.
  fallback_aliases:
    akiec: ["akiec", "akiiec", "actinic keratosis", "actinic keratoses",
             "intraepithelial carcinoma", "bowen disease"]
    bkl: ["bkl", "benign keratosis", "benign keratosis-like lesions",
          "solar lentigo", "lentigo"]
    vasc: ["vasc", "vascular lesions", "vascular lesion"]
    df: ["df", "dermatofibroma"]
    nv: ["nv", "melanocytic nevus", "melanocytic nevi", "nevus", "nevi"]
    mel: ["mel", "melanoma"]
    bcc: ["bcc", "basal cell carcinoma"]
    scc: ["scc", "squamous cell carcinoma"]

# Segmentation dataset (ISIC 2018 Task 1 training set)
segmentation:
  dataset: "isic2018"
  images_subdir: "ISIC2018_Training_Input"
  masks_subdir: "ISIC2018_Training_GroundTruth"
